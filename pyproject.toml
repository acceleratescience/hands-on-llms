[project]
name = "hands-on-llms"
version = "2.0"
description = "A hands on guide to working with LLMs"
authors = [
    { name = "Ryan Daniels" },
    { name = "Radzim Sendyka" },
    { name = "Fin Griffin" },
    { name = "Fariba Yousefi" },
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.11,<4.0"

dependencies = [
    "llama-index>=0.11.23",
    "openai>=3.6.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "pydantic>=2.9.2",
    "chromadb>=0.5.18",
    "streamlit>=1.40.1",
    "transformers>=4.46.2",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "scikit-learn>=1.9.0",
    "pysyllables>=1.0.3",
    "jinja2>=3.1.6",
    "tqdm>=4.67.0",
    "numpy>=2.1.3",
    "pymupdf>=1.24.13",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "datasets>=5.0.1",
    "hf-transfer",
    "pandas>=3.0.5",
    "pip>=25.3",
    "langgraph>=1.1.3",
    "langchain>=1.2.13",
    "autogen-agentchat>=0.7.5",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-material>=9.5.44,<10.0.0",
    "mkdocstrings>=0.27.0,<0.28.0",
]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"